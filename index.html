<!DOCTYPE html>
<html>
<head>
    <title>EduConnect Africa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f0f4f8;
            text-align: center;
        }
        header {
            background: #075e54;
            color: white;
            padding: 25px;
        }
        h1 {
            font-size: 30px;
        }
        .welcome {
            padding: 30px 15px;
        }
        .card {
            background: white;
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
        }
        button {
            background: #075e54;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<header>
    <h1>EduConnect Africa</h1>
    <p>Learn • Connect • Compete</p>
</header>

<div class="welcome">
    <h2>Welcome to EduConnect Africa!</h2>
    <p>A world of learning, friendship and opportunities.</p>
</div>

<div class="card">
    <h2>📚 Education</h2>
    <p>Learn, revise and share knowledge.</p>
</div>

<div class="card">
    <h2>🌍 Student Community</h2>
    <p>Connect with students around the world.</p>
</div>

<div class="card">
    <h2>🏆 Competitions</h2>
    <p>Challenge yourself and compete with others.</p>
</div>

</body>
